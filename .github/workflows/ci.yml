name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: postgresql://personalise_kings:personalise_kings@127.0.0.1:5432/personalise_kings?schema=public
  POSTGRES_PASSWORD: personalise_kings
  OBJECT_STORAGE_ROOT: /tmp/personalise-kings-storage
  PK_WEBAPP_URL: http://localhost:3000
  PK_CUSTOMISER_URL: http://localhost:3001
  PK_API_URL: http://localhost:3002
  PK_ADMIN_MFA_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
  PK_ADMIN_RECOVERY_CODE_PEPPER: ci-only-recovery-code-pepper
  PK_CONNECTOR_SECRET_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
  PK_EMBED_TOKEN_SECRET: ci-only-embed-token-secret
  PK_OBJECT_URL_SECRET: ci-only-object-url-secret
  PK_DEMO_CONNECTOR_SECRET: ci-only-connector-secret
  PK_RUN_DATABASE_INTEGRATION_TESTS: "true"

jobs:
  validate:
    name: Validate workspace
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
        env:
          POSTGRES_DB: personalise_kings
          POSTGRES_USER: personalise_kings
          POSTGRES_PASSWORD: personalise_kings
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U personalise_kings -d personalise_kings"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.13

      - name: Set up minimum supported PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: "8.1"
          coverage: none

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Generate and validate Prisma client
        run: |
          bun run prisma:generate
          bun --filter @personalise-kings/db prisma validate --schema prisma/schema.prisma

      - name: Apply migrations to clean PostgreSQL
        run: |
          bun --filter @personalise-kings/db prisma migrate deploy --schema prisma/schema.prisma
          bun --filter @personalise-kings/db prisma migrate status --schema prisma/schema.prisma

      - name: Validate development service configuration
        run: |
          docker compose config --quiet
          docker compose -f compose.production.yml config --quiet

      - name: Check WooCommerce connector syntax
        run: |
          git ls-files '*.php' | xargs -r -n1 php -l
          git ls-files 'apps/woocommerce-connector/assets/*.js' | xargs -r -n1 node --check
          php apps/woocommerce-connector/tests/mapping-state.php

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Build production applications
        run: bun run build
